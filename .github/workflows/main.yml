name: Build Minimal Linux x86

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libelf-dev libssl-dev libncurses-dev cpio xorriso syslinux

    - name: Set up Workspace
      run: |
        mkdir -p workspace
        cd workspace
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.6.tar.xz
        tar -xf linux-6.12.6.tar.xz
        mv linux-6.12.6 linux-src
        wget https://landley.net/toybox/downloads/toybox-0.8.11.tar.gz
        tar -xf toybox-0.8.11.tar.gz
        mv toybox-0.8.11 toybox-src

    - name: Compile Kernel
      run: |
        cd workspace/linux-src
        make x86_64_defconfig
        scripts/config --disable DEBUG_INFO
        make -j$(nproc) bzImage
        mkdir -p ../iso/boot
        cp arch/x86/boot/bzImage ../iso/boot/vmlinuz

    - name: Compile Toybox + Build Rootfs
      run: |
        cd workspace
        mkdir -p rootfs/{bin,sbin,etc,proc,sys,dev,usr/bin,usr/sbin}
        
        cd toybox-src
        make defconfig
        echo "CONFIG_STATIC=y" >> .config
        make -j$(nproc)
        make install CONFIG_PREFIX=../rootfs

        cd ../rootfs
        # PENTING: bikin symlink sh dan device node
        ln -sf toybox bin/sh
        ln -sf toybox bin/ls
        ln -sf toybox bin/mount
        sudo mknod -m 622 dev/console c 5 1
        sudo mknod -m 666 dev/null c 1 3
        sudo mknod -m 666 dev/tty c 5 0

    - name: Create Init Script
      run: |
        cat << 'EOF' > workspace/rootfs/init
        #!/bin/sh
        mount -t proc proc /proc
        mount -t sysfs sys /sys
        mount -t devtmpfs dev /dev
        echo "Booting Minimal Linux..."
        exec /bin/sh
        EOF
        chmod +x workspace/rootfs/init

    - name: Create Initramfs
      run: |
        cd workspace/rootfs
        find . | cpio -H newc -o | gzip > ../iso/boot/initramfs.cpio.gz

    - name: Configure Isolinux
      run: |
        mkdir -p workspace/iso/boot/isolinux
        cp /usr/lib/ISOLINUX/isolinux.bin workspace/iso/boot/isolinux/
        cp /usr/lib/syslinux/modules/bios/ldlinux.c32 workspace/iso/boot/isolinux/
        cat << 'EOF' > workspace/iso/boot/isolinux/isolinux.cfg
        default minimal
        label minimal
          kernel /boot/vmlinuz
          append initrd=/boot/initramfs.cpio.gz root=/dev/ram0 console=ttyS0
        EOF

    - name: Create ISO
      run: |
        cd workspace
        xorriso -as mkisofs -o minimal_linux.iso \
          -b boot/isolinux/isolinux.bin \
          -c boot/isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          iso

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: minimal-linux-iso
        path: workspace/minimal_linux.iso
