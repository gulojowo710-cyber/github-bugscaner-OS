name: Build BugScannerOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install GUI Lengkap
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget cpio gzip xorriso xserver-xorg-core xinit xserver-xorg-video-vesa xfonts-base jwm xterm

    - name: Download Kernel TinyCore
      run: |
       wget http://tinycorelinux.net/15.x/x86/release/distribution_files/vmlinuz
       mkdir -p rootfs/boot  # <-- bikin folder boot
       mv vmlinuz rootfs/boot/vmlinuz  # <-- pindahin ke sini

    - name: Copy GUI ke rootfs
      run: |
        mkdir -p rootfs/usr/bin rootfs/usr/lib/xorg rootfs/usr/share
        cp /usr/bin/Xorg rootfs/usr/bin/
        cp /usr/bin/xinit rootfs/usr/bin/
        cp /usr/bin/jwm rootfs/usr/bin/
        cp /usr/bin/xterm rootfs/usr/bin/
        cp -r /usr/lib/xorg rootfs/usr/lib/
        cp -r /usr/share/* rootfs/usr/share/

    - name: Buat init + .xinitrc
      run: |
        mkdir -p rootfs/root
        
        echo '#!/bin/busybox sh' > rootfs/init
        echo 'mount -t proc proc /proc' >> rootfs/init
        echo 'mount -t sysfs sysfs /sys' >> rootfs/init
        echo 'mount -t devtmpfs dev /dev' >> rootfs/init
        echo 'export PATH=/bin:/usr/bin' >> rootfs/init
        echo 'export HOME=/root' >> rootfs/init
        echo 'xinit' >> rootfs/init
        chmod +x rootfs/init
        
        echo 'exec jwm' > rootfs/root/.xinitrc
        chmod +x rootfs/root/.xinitrc

     - name: Pack to ISO
       run: |
        cd rootfs
        find . | cpio -o -H newc | gzip > ../iso/rootfs.gz
        cd ../iso
        xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid "BUGSCANNER" -eltorito-boot boot/vmlinuz -no-emul-boot -boot-load-size 4 -boot-info-table -o BugScanner-Pro.iso .
        
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: BugScanner-Pro
        path: iso/BugScanner-Pro.iso
