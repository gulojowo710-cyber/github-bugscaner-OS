name: Build Minimal Linux GUI x86

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libelf-dev libssl-dev libncurses-dev cpio xorriso syslinux wget

    - name: Download Kernel + Toybox
      run: |
        mkdir workspace && cd workspace
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.6.tar.xz
        tar xf linux-6.12.6.tar.xz && mv linux-6.12.6 linux-src
        wget https://landley.net/toybox/downloads/toybox-0.8.11.tar.gz
        tar xf toybox-0.8.11.tar.gz && mv toybox-0.8.11 toybox-src

    - name: Compile Kernel
      run: |
        cd workspace/linux-src
        make x86_64_defconfig
        scripts/config --disable DEBUG_INFO
        make -j$(nproc) bzImage
        mkdir -p ../iso/boot
        cp arch/x86/boot/bzImage ../iso/boot/vmlinuz

    - name: Build Rootfs + GUI
      run: |
        cd workspace
        mkdir -p rootfs/{bin,sbin,etc,proc,sys,dev,usr/bin,usr/sbin,usr/lib,home/user}
    
        # 1. Toybox static
        cd toybox-src
        make defconfig
        echo "CONFIG_STATIC=y" >> .config
        make -j$(nproc)
        make install CONFIG_PREFIX=../rootfs
        cd ../rootfs
        ln -sf toybox bin/sh

        
    - name: Upload kernel+toybox
      uses: actions/upload-artifact@v4
      with:
        name: minimal-linux-gui-iso
        path: workspace/minimal_gui
